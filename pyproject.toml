[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tokenforensics"
version = "0.1.0"
description = "A terminal-first crypto token health check and Markdown report generator."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0,<1.0.0",
    "rich>=13.7.0,<14.0.0",
    "typer>=0.12.0,<1.0.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0.0,<9.0.0"]

[project.scripts]
tokenforensics = "tokenforensics.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/tokenforensics"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]